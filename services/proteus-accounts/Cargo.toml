[package]
name = "proteus-accounts"
version = "0.1.0"
edition = "2021"
description = "Online accounts seats for Proteus Settings (PKCE + token vault)"
license = "GPL-3.0-only"

[[bin]]
name = "proteus-accounts"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
url = "2"
rand = "0.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
