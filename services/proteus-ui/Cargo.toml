[package]
name = "proteus-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Shared iced UI kit for Proteus shell and sibling apps"

[lib]
name = "proteus_ui"
path = "src/lib.rs"

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "web-colors",
    "crisp",
    "wayland",
    "x11",
    "wgpu",
    "tiny-skia",
    "thread-pool",
] }
proteus-shell-core = { path = "../proteus-shell-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
