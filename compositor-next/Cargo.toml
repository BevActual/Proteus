# Smithay rung-2 spike (OWNED-STACK) — nested winit compositor hosting
# xdg-shell toplevels + wlr-layer-shell so proteus-shell layers can map.
# No session takeover, no DRM backend. Hyprland stays the shipping compositor.

[package]
name = "compositor-next"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "proteus-compositor-next"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
] }
