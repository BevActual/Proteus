# Owned Smithay session compositor (OWNED-STACK). Nested winit + DRM via
# proteus-session (Hyprland purged). Build: cargo build -p compositor.

[package]
name = "compositor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "proteus-compositor"
path = "src/main.rs"

[[bin]]
name = "proteus-compositorctl"
path = "src/bin/proteus-compositorctl.rs"

[dependencies]
cosmic-text = "0.15"
serde_json = { workspace = true }
xcursor = "0.3"
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
