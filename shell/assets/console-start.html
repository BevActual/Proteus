<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proteus</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0e12;
      --fg: #e8eaed;
      --mute: #8b919a;
      --accent: #3d8bfd;
      --elev: #161a22;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #1a2332 0%, var(--bg) 55%);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    main { width: min(720px, 100%); }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    p { margin: 0 0 28px; color: var(--mute); font-size: 1.1rem; }
    form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }
    input[type="search"] {
      flex: 1;
      height: 52px;
      border-radius: 14px;
      border: 1px solid #2a3340;
      background: var(--elev);
      color: var(--fg);
      padding: 0 18px;
      font-size: 1.05rem;
      outline: none;
    }
    input[type="search"]:focus { border-color: var(--accent); }
    button {
      height: 52px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }
    a {
      display: block;
      text-decoration: none;
      color: var(--fg);
      background: var(--elev);
      border: 1px solid #2a3340;
      border-radius: 14px;
      padding: 16px 14px;
      font-weight: 600;
    }
    a:hover, a:focus { border-color: var(--accent); outline: none; }
    a span { display: block; margin-top: 4px; color: var(--mute); font-size: 0.85rem; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>Proteus</h1>
    <p>Console browser — search or open a site.</p>
    <form action="https://duckduckgo.com/" method="get">
      <input type="search" name="q" placeholder="Search the web…" autofocus autocomplete="off" />
      <button type="submit">Go</button>
    </form>
    <div class="links">
      <a href="https://duckduckgo.com/">DuckDuckGo<span>Search</span></a>
      <a href="https://wikipedia.org/">Wikipedia<span>Reference</span></a>
      <a href="https://www.youtube.com/">YouTube<span>Video</span></a>
      <a href="https://news.ycombinator.com/">HN<span>News</span></a>
    </div>
  </main>
</body>
</html>
