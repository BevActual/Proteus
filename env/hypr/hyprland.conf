# Proteus nested Hyprland — isolated from Omarchy daily session.
# Launch via: ./scripts/run-nested.sh

$terminal = ghostty

monitor = ,preferred,auto,1

# Defaults overridden by proteus-general.conf when present (Settings → Desktop)
general {
  gaps_in = 8
  gaps_out = 14
  border_size = 2
  col.active_border = rgba(3d8bfdcc)
  col.inactive_border = rgba(2a3544aa)
}

decoration {
  rounding = 10
}

animations {
  enabled = true
}

input {
  follow_mouse = 1
}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
  # Allow Quickshell to re-lock after a crash while locked
  allow_session_lock_restore = true
}

# Proteus shell + wallpaper runtime
exec-once = PROTEUS_SURFACE=desktop quickshell -p SHELL_DIR_PLACEHOLDER
exec-once = proteus-bg
exec-once = $terminal
# Interim clipboard history store (cliphist) — replace with first-party later
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Displays stub — Settings → Displays writes ~/.config/hypr/proteus-monitors.conf
source = ~/.config/hypr/proteus-monitors.conf

# Desktop gaps/borders/rounding/animations — Settings → Desktop
source = ~/.config/hypr/proteus-general.conf

# Keyboard shortcuts — Settings → Keyboard writes ~/.config/hypr/proteus-keybinds.conf
source = ~/.config/hypr/proteus-keybinds.conf

# Active posture profile (desktop|media) — pointer rewritten by set-hypr-profile.sh
source = ~/.config/hypr/proteus-profile.conf
