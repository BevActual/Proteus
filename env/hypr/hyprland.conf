# Proteus nested Hyprland — isolated from Omarchy daily session.
# Launch via: ./dev/run-nested.sh

$terminal = proteus-terminal

monitor = ,preferred,auto,1

# Defaults overridden by proteus-general.conf when present (Settings → Desktop)
general {
  gaps_in = 8
  gaps_out = 14
  border_size = 2
  col.active_border = rgba(3d8bfdcc)
  col.inactive_border = rgba(2a3544aa)
}

decoration {
  rounding = 10
}

animations {
  enabled = true
}

input {
  follow_mouse = 1
}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
  # Allow Quickshell to re-lock after a crash while locked
  allow_session_lock_restore = true
}

# Proteus shell chrome (owned iced via proteus-chrome).
# PROTEUS_SURFACE unset → proteus-chrome reads ~/.config/proteus/posture.
exec-once = PROTEUS_ROOT=SHELL_DIR_PLACEHOLDER/.. SHELL_DIR_PLACEHOLDER/scripts/proteus-chrome
# proteus-bg is a no-op (owned shell paints wallpaper); kept for legacy confs.
exec-once = proteus-bg
# Gamepad Guide + chrome pad grammar (listen-only; safe when no pads)
exec-once = proteus-guide
# Terminal is on-demand (Dock / Super+Return) — do not exec-once Ghostty / kitty / etc.
# Allowed exec-once: proteus-chrome, proteus-bg, polkit agent, cliphist watchers (+ hypridle via install).
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Polkit auth agent — pkexec (proteus-pkg / proteus-logind / timedatectl) needs a GUI prompt
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent

# Displays stub — Settings → Displays writes ~/.config/hypr/proteus-monitors.conf
source = ~/.config/hypr/proteus-monitors.conf

# Desktop gaps/borders/rounding/animations — Settings → Desktop
source = ~/.config/hypr/proteus-general.conf

# Keyboard shortcuts — Settings → Keyboard writes ~/.config/hypr/proteus-keybinds.conf
source = ~/.config/hypr/proteus-keybinds.conf

# Active posture profile (desktop|console|host|home) — soft pointer; hard flip via proteus-posture
source = ~/.config/hypr/proteus-profile.conf
