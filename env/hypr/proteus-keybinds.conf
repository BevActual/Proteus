# Generated by Proteus Settings — Keyboard
# Edit here or in Settings → Keyboard. Reloaded via hyprctl.
# Capture tools are interim (shell/scripts/proteus-*) until first-party chrome.

# Apps
bind = SUPER, Return, exec, proteus-terminal
bind = SUPER, SPACE, global, proteus:launcher
bind = SUPER, D, global, proteus:launcher
bind = SUPER, comma, global, proteus:settings

# Session
bind = SUPER, L, global, proteus:lock
bind = SUPER SHIFT, W, global, proteus:customize-desktop
bind = SUPER SHIFT, E, exit,

# Windows
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,

# Spaces (proteus-workspace — synced / per-display via settings.json)
bind = SUPER, 1, exec, proteus-workspace goto 1
bind = SUPER, 2, exec, proteus-workspace goto 2
bind = SUPER, 3, exec, proteus-workspace goto 3
bind = SUPER, 4, exec, proteus-workspace goto 4
bind = SUPER, 5, exec, proteus-workspace goto 5
bind = SUPER, 6, exec, proteus-workspace goto 6
bind = SUPER CTRL, 1, exec, proteus-workspace goto 1 --local
bind = SUPER CTRL, 2, exec, proteus-workspace goto 2 --local
bind = SUPER CTRL, 3, exec, proteus-workspace goto 3 --local
bind = SUPER CTRL, 4, exec, proteus-workspace goto 4 --local
bind = SUPER CTRL, 5, exec, proteus-workspace goto 5 --local
bind = SUPER CTRL, 6, exec, proteus-workspace goto 6 --local
bind = SUPER SHIFT, 1, exec, proteus-workspace move 1
bind = SUPER SHIFT, 2, exec, proteus-workspace move 2
bind = SUPER SHIFT, 3, exec, proteus-workspace move 3
bind = SUPER SHIFT, 4, exec, proteus-workspace move 4
bind = SUPER SHIFT, 5, exec, proteus-workspace move 5
bind = SUPER SHIFT, 6, exec, proteus-workspace move 6

# Capture (interim — proteus-screenshot / clipboard / colorpick)
bind = SUPER SHIFT, S, exec, proteus-screenshot region
bind = , Print, exec, proteus-screenshot screen
bind = SUPER SHIFT, V, exec, proteus-clipboard
bind = SUPER SHIFT, C, exec, proteus-colorpick

# Media (Status HUD · volume)
bind = , XF86AudioRaiseVolume, global, proteus:volume-up
bind = , XF86AudioLowerVolume, global, proteus:volume-down
bind = , XF86AudioMute, global, proteus:volume-mute
bind = , XF86MonBrightnessUp, global, proteus:brightness-up
bind = , XF86MonBrightnessDown, global, proteus:brightness-down
