# Generated by Proteus Settings — Keyboard
# Edit here or in Settings → Keyboard. Reloaded via hyprctl.
# Capture tools are interim (shell/scripts/proteus-*) until first-party chrome.

# Apps
bind = SUPER, Return, exec, proteus-terminal
bind = SUPER, SPACE, global, proteus:launcher
bind = SUPER, D, global, proteus:launcher
bind = SUPER, comma, global, proteus:settings

# Session
bind = SUPER, L, global, proteus:lock
bind = SUPER SHIFT, W, global, proteus:customize-desktop
bind = SUPER SHIFT, F, global, proteus:focus-cycle
bind = SUPER SHIFT, C, exec, proteus-posture console
bind = SUPER SHIFT, H, exec, proteus-posture host --chrome
bind = SUPER, Home, global, proteus:console-nav
bind = SUPER SHIFT, E, exit,

# Windows
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,

# Spaces (proteus-workspace — synced / per-display via settings.json)
bind = SUPER, 1, exec, proteus-workspace goto 1
bind = SUPER, 2, exec, proteus-workspace goto 2
bind = SUPER, 3, exec, proteus-workspace goto 3
bind = SUPER, 4, exec, proteus-workspace goto 4
bind = SUPER, 5, exec, proteus-workspace goto 5
bind = SUPER, 6, exec, proteus-workspace goto 6
bind = SUPER, 7, exec, proteus-workspace goto 7
bind = SUPER, 8, exec, proteus-workspace goto 8
bind = SUPER, 9, exec, proteus-workspace goto 9
bind = SUPER, 0, exec, proteus-workspace goto 10
bind = SUPER CTRL, 1, exec, proteus-workspace goto 1 --local
bind = SUPER CTRL, 2, exec, proteus-workspace goto 2 --local
bind = SUPER CTRL, 3, exec, proteus-workspace goto 3 --local
bind = SUPER CTRL, 4, exec, proteus-workspace goto 4 --local
bind = SUPER CTRL, 5, exec, proteus-workspace goto 5 --local
bind = SUPER CTRL, 6, exec, proteus-workspace goto 6 --local
bind = SUPER CTRL, 7, exec, proteus-workspace goto 7 --local
bind = SUPER CTRL, 8, exec, proteus-workspace goto 8 --local
bind = SUPER CTRL, 9, exec, proteus-workspace goto 9 --local
bind = SUPER CTRL, 0, exec, proteus-workspace goto 10 --local
bind = SUPER SHIFT, 1, exec, proteus-workspace move 1
bind = SUPER SHIFT, 2, exec, proteus-workspace move 2
bind = SUPER SHIFT, 3, exec, proteus-workspace move 3
bind = SUPER SHIFT, 4, exec, proteus-workspace move 4
bind = SUPER SHIFT, 5, exec, proteus-workspace move 5
bind = SUPER SHIFT, 6, exec, proteus-workspace move 6
bind = SUPER SHIFT, 7, exec, proteus-workspace move 7
bind = SUPER SHIFT, 8, exec, proteus-workspace move 8
bind = SUPER SHIFT, 9, exec, proteus-workspace move 9
bind = SUPER SHIFT, 0, exec, proteus-workspace move 10
# Scratchpad (special:scratch — ≠ dock minimize special:minimized)
bind = SUPER, S, exec, proteus-workspace scratch-toggle
bind = SUPER ALT, S, exec, proteus-workspace scratch-move
# Custom specials (settings.json specialWorkspaces[0..7] — empty slot no-ops)
bind = SUPER ALT, 1, exec, proteus-workspace special-toggle-index 1
bind = SUPER ALT, 2, exec, proteus-workspace special-toggle-index 2
bind = SUPER ALT, 3, exec, proteus-workspace special-toggle-index 3
bind = SUPER ALT, 4, exec, proteus-workspace special-toggle-index 4
bind = SUPER ALT, 5, exec, proteus-workspace special-toggle-index 5
bind = SUPER ALT, 6, exec, proteus-workspace special-toggle-index 6
bind = SUPER ALT, 7, exec, proteus-workspace special-toggle-index 7
bind = SUPER ALT, 8, exec, proteus-workspace special-toggle-index 8
bind = SUPER ALT SHIFT, 1, exec, proteus-workspace special-move-index 1
bind = SUPER ALT SHIFT, 2, exec, proteus-workspace special-move-index 2
bind = SUPER ALT SHIFT, 3, exec, proteus-workspace special-move-index 3
bind = SUPER ALT SHIFT, 4, exec, proteus-workspace special-move-index 4
bind = SUPER ALT SHIFT, 5, exec, proteus-workspace special-move-index 5
bind = SUPER ALT SHIFT, 6, exec, proteus-workspace special-move-index 6
bind = SUPER ALT SHIFT, 7, exec, proteus-workspace special-move-index 7
bind = SUPER ALT SHIFT, 8, exec, proteus-workspace special-move-index 8

# Capture (interim — proteus-screenshot / clipboard / colorpick)
bind = SUPER SHIFT, S, exec, proteus-screenshot region
bind = , Print, exec, proteus-screenshot screen
bind = SUPER SHIFT, V, exec, proteus-clipboard
bind = SUPER SHIFT, Y, exec, proteus-colorpick
# Note: catalog in Keybinds.qml is SoT; posture filter rewrites this on chrome start.

# Media (Status HUD · volume)
bind = , XF86AudioRaiseVolume, global, proteus:volume-up
bind = , XF86AudioLowerVolume, global, proteus:volume-down
bind = , XF86AudioMute, global, proteus:volume-mute
bind = , XF86MonBrightnessUp, global, proteus:brightness-up
bind = , XF86MonBrightnessDown, global, proteus:brightness-down
