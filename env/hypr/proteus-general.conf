# Generated by Proteus Settings — Desktop
# Edit here or in Settings → Desktop. Applied via hyprctl + reload.

general {
  gaps_in = 8
  gaps_out = 14
  border_size = 2
  col.active_border = rgba(3d8bfdcc)
  col.inactive_border = rgba(2a3544aa)
}

decoration {
  rounding = 10
  blur {
    enabled = false
    size = 0
    passes = 1
  }
}

animations {
  enabled = true
}

input {
  sensitivity = 0
  accel_profile = adaptive
  touchpad {
    natural_scroll = false
    tap-to-click = true
    disable_while_typing = true
    clickfinger_behavior = false
    scroll_factor = 1
  }
  tablet {
    transform = 0
    relative_input = false
    left_handed = false
    active_area_position = 0 0
    active_area_size = 0 0
    region_position = 0 0
    region_size = 0 0
    absolute_region_position = false
  }
  tablettool {
    pressure_range_min = -1
    pressure_range_max = -1
    eraser_button_mode = 0
    eraser_button_override = 0
  }
}
