# Proteus posture profile — console (kiosk-scoped Hyprland)
# Hard switch: vm/guest/proteus-posture console
# Soft pointer only: vm/guest/set-hypr-profile.sh console|media
# Product: fullscreen apps + sparse ConsoleShell chrome (layer surfaces).
# Per-title Gamescope wraps games; session compositor stays Hyprland.
# Window rules: Hyprland ≥0.53 static syntax (windowrulev2 deprecated).

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
  col.active_border = rgba(00000000)
  col.inactive_border = rgba(00000000)
}

decoration {
  rounding = 0
  blur {
    enabled = false
  }
  shadow {
    enabled = false
  }
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
  focus_on_activate = true
}

# Force app windows fullscreen (anonymous form — most reliable on 0.56).
# Layer-shell chrome is unaffected. QS / Settings opt out below.
windowrule = match:class .+, fullscreen on

# Keep Quickshell / Settings usable if opened from console CC
windowrule = match:class quickshell, float on, fullscreen off
windowrule = match:title Proteus Settings, float on, center on, fullscreen off
