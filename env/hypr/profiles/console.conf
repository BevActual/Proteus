# Proteus posture profile — console (kiosk-scoped Hyprland)
# Hard switch: shell/scripts/proteus-posture console
# Soft pointer only: shell/scripts/set-hypr-profile.sh console|media
# Product: fullscreen apps + sparse ConsoleShell chrome (layer surfaces).
# Phase 1: Hyprland stays session compositor; proteus-console-seat supervises titles.
# Per-title Gamescope when Vulkan works; full Gamescope *session* later.
# Window rules: Hyprland ≥0.53 static syntax (windowrulev2 deprecated).

general {
  gaps_in = 0
  gaps_out = 0
  border_size = 0
  col.active_border = rgba(00000000)
  col.inactive_border = rgba(00000000)
}

decoration {
  rounding = 0
  blur {
    enabled = false
  }
  shadow {
    enabled = false
  }
}

animations {
  enabled = false
}

misc {
  disable_hyprland_logo = true
  force_default_wallpaper = 0
  focus_on_activate = true
}

# Quickshell sometimes appears as an XDG toplevel (class org.quickshell) and
# steals the dwindle split from game seats. Park it on a silent special
# workspace so titles own the monitor; layer-shell chrome still paints.
windowrule = workspace special:proteus-chrome silent, float on, fullscreen off, match:class org.quickshell
windowrule = workspace special:proteus-chrome silent, float on, fullscreen off, match:class .*[Qq]uickshell.*
windowrule = float on, center on, fullscreen off, match:title Proteus Settings

# Apps: fullscreen kiosk (do not use class .* before chrome rules — order matters
# less when chrome is on a different workspace).
windowrule = fullscreen on, match:class .*
windowrule = fullscreen_state 2 2, match:class .*
