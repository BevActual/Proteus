# Proteus posture profile — desktop (tiling compositor posture)
# Selected via ~/.config/hypr/proteus-profile.conf (see set-hypr-profile.sh).
# Settings-owned fragments stay in proteus-general / keybinds / monitors.

# Desktop defaults: tiled master/dwindle-friendly layout.
dwindle {
  pseudotile = true
  preserve_split = true
}

misc {
  # Desktop sessions expect focus-follows-mouse from input{}; keep logo off.
  disable_hyprland_logo = true
  force_default_wallpaper = 0
}
