<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Spotlight">
  <!-- Search + sparkle — transparent; dock SquircleIcon supplies the plate -->
  <defs>
    <linearGradient id="metal" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#e8eef8"/>
      <stop offset="100%" stop-color="#9aabc4"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ec0ff"/>
      <stop offset="55%" stop-color="#3d8bfd"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- magnifying glass -->
    <g fill="none" stroke="url(#metal)" stroke-width="9" stroke-linecap="round">
      <circle cx="52" cy="54" r="28"/>
      <line x1="72" y1="74" x2="98" y2="100"/>
    </g>
    <!-- Proteus sparkle -->
    <path fill="url(#spark)"
          d="M98 26
             L102.2 38.5
             L115 42.5
             L102.2 46.5
             L98 59
             L93.8 46.5
             L81 42.5
             L93.8 38.5
             Z"/>
    <circle cx="98" cy="42.5" r="3.2" fill="#ffffff" opacity="0.55"/>
  </g>
</svg>
