[terminal]
# The VT to run the greeter on. Can be the number of a VT, or "next"/"current"
vt = 1

[default_session]
command = "tuigreet --time --remember --remember-user-session --asterisks --greeting 'Proteus — Bevington Systems' --sessions /usr/share/wayland-sessions --cmd /usr/local/bin/proteus-session"
user = "greeter"
